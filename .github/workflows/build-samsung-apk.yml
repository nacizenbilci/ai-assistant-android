name: Build Samsung APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore permanent Saban signing key
        env:
          SABAN_KEYSTORE_BASE64: ${{ secrets.SABAN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SABAN_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/saban-release.jks"

      - name: Build permanently signed release APK
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/saban-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SABAN_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: saban
          KEYSTORE_KEY_PASSWORD: ${{ secrets.SABAN_KEY_PASSWORD }}
        run: |
          ./gradlew \
            --no-daemon \
            clean \
            assembleRelease

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/Saban-SM-P587.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            app/build/outputs/apk/release/Saban-SM-P587.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saban-Signed-SM-P587
          path: app/build/outputs/apk/release/Saban-SM-P587.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saban-build-${{ github.run_number }}
          name: Şaban Build ${{ github.run_number }}
          make_latest: true
          body: |
            Otomatik ŞABAN güncellemesi.
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/Saban-SM-P587.apk
